[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "abstract-checker"
version = "0.1.0"
description = "Check abstracts for IMRaD structure, word limits and missing quantitative results."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
abstract-checker = "abstract_checker.cli:main"

[tool.setuptools]
packages = ["abstract_checker"]
